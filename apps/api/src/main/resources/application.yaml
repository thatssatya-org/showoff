spring:
  application:
    name: portfolio-api
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
springdoc:
  api-docs:
    path: /openapi.json
server:
  compression:
    enabled: true
    min-response-size: 1024
portfolio:
  github-refresh:
    enabled: false
    public-approved: false
    profile-id: github-primary
    handle: replace-me
    repository-owner: replace-me
    repository-name: replace-me
    cron: "0 */15 * * * *"
