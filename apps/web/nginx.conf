server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tailnet traffic enters this Compose network through the host gateway after
    # the local userspace proxy adds the original client address to X-Forwarded-For.
    # Trust only those internal bridge hops before evaluating operator access.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # `portfolio-edge` is pinned in compose.local.yaml. The second range is
    # the local Tailscale Serve bridge, which forwards the original Tailnet
    # address in X-Forwarded-For. Trust no other Docker bridge.
    set_real_ip_from 172.30.0.0/24;
    set_real_ip_from 172.29.0.0/16;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # This surface is deliberately absent from the public API. The web proxy is
    # the only hop allowed to assert the client address consumed by the API.
    location = /operator/github/token {
        limit_except POST { deny all; }
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;

        client_max_body_size 2k;
        proxy_pass http://api:8080/internal/v1/provider-profiles/github/pat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Portfolio-Client-Address $remote_addr;
    }

    # Manual cache refresh is an operator action. Keep it behind the same
    # Tailnet and canonical-client-address boundary as token submission.
    location = /operator/github/activity/refresh {
        limit_except POST { deny all; }
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;

        proxy_pass http://api:8080/internal/v1/provider-profiles/github/activity/refresh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Portfolio-Client-Address $remote_addr;
    }

    # Pairing is write-only and Tailnet-only. The browser never receives a
    # Beszel URL, token, raw record, or direct route to the Beszel dashboard.
    location = /operator/beszel/pair {
        limit_except POST { deny all; }
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;

        client_max_body_size 2k;
        proxy_pass http://api:8080/internal/v1/provider-profiles/beszel/pair;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Portfolio-Client-Address $remote_addr;
    }

    location ^~ /operator/ {
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;
        try_files $uri $uri/ /operator/github/index.html;
    }

    location / {
        try_files $uri $uri/ /404.html;
    }
}
