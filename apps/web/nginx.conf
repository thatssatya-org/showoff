server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the internal API only when an API route is requested. The static
    # portfolio remains available when the optional API process is restarting.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $portfolio_api api:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://$portfolio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # This surface is deliberately absent from the public API. The web proxy is
    # the only hop allowed to assert the client address consumed by the API.
    location = /operator/github/token {
        limit_except POST { deny all; }
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;

        client_max_body_size 2k;
        proxy_pass http://$portfolio_api/internal/v1/provider-profiles/github/pat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Portfolio-Client-Address $remote_addr;
    }

    location = /operator/github/activity/refresh {
        limit_except POST { deny all; }
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;

        proxy_pass http://$portfolio_api/internal/v1/provider-profiles/github/activity/refresh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Portfolio-Client-Address $remote_addr;
    }

    location ^~ /operator/ {
        allow 100.64.0.0/10;
        allow fd7a:115c:a1e0::/48;
        deny all;
        try_files $uri $uri/ /operator/github/index.html;
    }

    location / {
        try_files $uri $uri/ /404.html;
    }
}
